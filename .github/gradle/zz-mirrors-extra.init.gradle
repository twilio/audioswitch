/*
 * CI-only. Complements the init script installed by twilio/sdk-actions/artifactory-oidc, which only
 * rewrites project and settings plugin repositories. This script also routes:
 *   - buildscript { repositories {} } of every project (AGP, Kotlin Gradle plugin, ...)
 *   - the default Gradle Plugin Portal used by the plugins {} block when pluginManagement declares none
 * through the same curated Artifactory mirrors.
 *
 * Must sort after mirrors.init.gradle: that script fails on repositories it does not recognise, and
 * this one adds Artifactory repositories. It is installed as zz-mirrors-extra.init.gradle.
 * Keep the MIRRORS list in sync with the sdk-actions script.
 */
def MIRRORS = [
    [name: 'MavenRepo',                        public_url: 'https://repo.maven.apache.org/maven2/',    artifactory_repo: 'virtual-maven-thirdparty'],
    [name: 'Google',                           public_url: 'https://dl.google.com/dl/android/maven2/', artifactory_repo: 'remote-maven-google'],
    [name: 'Gradle Central Plugin Repository', public_url: 'https://plugins.gradle.org/m2/',           artifactory_repo: 'remote-maven-gradle-plugins'],
]

def propsFile = new File(gradle.gradleUserHomeDir, 'artifactoryoidc.properties')
def props = new Properties()
if (propsFile.exists()) {
    propsFile.withInputStream { props.load(it) }
}
def artifactoryUrl = props.getProperty('url')?.trim()?.replaceAll('/+$', '')
def artifactoryUsername = props.getProperty('username')
def artifactoryToken = props.getProperty('token')

if (!artifactoryUrl || !artifactoryUsername || !artifactoryToken) {
    throw new GradleException("artifactory-mirror-extra: url, username, and token must be set in ${propsFile}")
}

def mirrorUrl = { mirror -> "${artifactoryUrl}/artifactory/${mirror.artifactory_repo}/" }

// Point a repository at its mirror in place. Unknown repositories fail the build, like the main script.
def redirect = { repo, label ->
    if (!repo.hasProperty('url')) return
    def url = repo.url.toString()
    if (url.startsWith(artifactoryUrl)) return // already a mirror
    def match = MIRRORS.find { m -> repo.name == m.name || url.startsWith(m.public_url) }
    if (!match) {
        throw new GradleException("artifactory-mirror-extra: Unknown ${label} repository not mapped to a mirror: name=${repo.name} url=${url}")
    }
    logger.lifecycle("artifactory-mirror-extra: ${label}: replacing ${repo.name}[${url}] with ${mirrorUrl(match)}")
    repo.url = mirrorUrl(match)
    repo.credentials { username = artifactoryUsername; password = artifactoryToken }
}

// buildscript repositories are declared by the build script itself, after init scripts run.
gradle.allprojects { p ->
    p.buildscript.repositories.whenObjectAdded { repo -> redirect(repo, "buildscript repos of '${p.name}'") }
}

// plugins {} resolves from the Gradle Plugin Portal when pluginManagement declares no repository.
settingsEvaluated { settings ->
    def repos = settings.pluginManagement.repositories
    if (repos.isEmpty()) {
        def m = MIRRORS.find { it.name == 'Gradle Central Plugin Repository' }
        logger.lifecycle("artifactory-mirror-extra: no pluginManagement repositories, adding ${mirrorUrl(m)}")
        repos.maven {
            name = 'Artifactory-Mirror-Gradle Central Plugin Repository'
            url mirrorUrl(m)
            credentials { username = artifactoryUsername; password = artifactoryToken }
        }
    }
}
