# TEMPORARY diagnostic: which versions of some artifacts does curated Artifactory serve? Delete after use.
name: Diag Versions

on:
  push:
    branches: ["supplychain_*"]
    paths: [".github/workflows/diag-versions.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-x64
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 15
    steps:
      - uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"
      - name: Probe versions
        run: |
          props=~/.gradle/artifactoryoidc.properties
          url=$(grep '^url=' $props | cut -d= -f2-)
          user=$(grep '^username=' $props | cut -d= -f2-)
          token=$(grep '^token=' $props | cut -d= -f2-)
          echo "::add-mask::$token"
          base="$url/artifactory/virtual-maven-thirdparty"
          probe() { # group-path artifact min-regex
            local g=$1 a=$2 re=$3
            echo "== $g/$a (HTTP 200 = served)"
            for v in $(curl -sS -u "$user:$token" "$base/$g/$a/maven-metadata.xml" | grep -o '<version>[^<]*' | sed 's/<version>//' | grep -E "$re" | grep -viE 'alpha|beta|rc|-m[0-9]|dev|eap|snapshot'); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -I -u "$user:$token" "$base/$g/$a/$v/$a-$v.jar")
              echo "$v $code"
            done | tr '\n' ';'; echo
          }
          probe io/netty netty-codec-http '^4\.1\.(11[0-9]|12[0-9]|13[0-9])'
          probe io/netty netty-handler '^4\.1\.(11[0-9]|12[0-9]|13[0-9])'
          probe org/jetbrains/kotlin kotlin-gradle-plugin '^(1\.8\.2|1\.9\.|2\.[0-3]\.)'
