# TEMPORARY diagnostic: which hosts does a clean Gradle build download from? Delete after use.
name: Diag Hosts

on:
  push:
    branches: ["supplychain_*"]
    paths: [".github/workflows/diag-hosts.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-x64
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"
      - name: Build and count download hosts
        run: |
          ./gradlew --info --no-daemon audioswitch:assemble spotlessCheck > "$RUNNER_TEMP/gradle.log" 2>&1 || echo "gradle exit $?"
          echo "== download requests by host"
          grep -E "Downloading https?://|HTTP GET" "$RUNNER_TEMP/gradle.log" | grep -oE "https?://[^/ ]+" | sort | uniq -c | sort -rn
          echo "== sample non-jfrog download lines"
          grep -E "Downloading https?://|HTTP GET" "$RUNNER_TEMP/gradle.log" | grep -v twilio.jfrog.io | cut -c1-200 | head -8
