# TEMPORARY diagnostic: which artifacts on the build classpath are still blocked once netty and
# bcprov are overridden? Resolves in a scratch project, leniently. Delete after use.
name: Diag Classpath

on:
  push:
    branches: ["supplychain_*"]
    paths: [".github/workflows/diag-classpath.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-x64
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"
      - run: cp .github/gradle/zz-mirrors-extra.init.gradle ~/.gradle/init.d/zz-mirrors-extra.init.gradle
      - name: Resolve classpath in a scratch project
        run: |
          s="$RUNNER_TEMP/scratch"; mkdir -p "$s"
          echo "rootProject.name = 'scratch'" > "$s/settings.gradle"
          cat > "$s/build.gradle" <<'GRADLE'
          repositories { gradlePluginPortal(); google(); mavenCentral() }
          configurations {
            probe {
              canBeConsumed = false
              attributes {
                attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
                attribute(org.gradle.api.attributes.java.TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, 17)
                attribute(org.gradle.api.attributes.plugin.GradlePluginApiVersion.GRADLE_PLUGIN_API_VERSION_ATTRIBUTE, objects.named(org.gradle.api.attributes.plugin.GradlePluginApiVersion, '8.13'))
              }
              resolutionStrategy.eachDependency { d ->
                if (d.requested.group == 'org.bouncycastle') d.useVersion('1.85')
                if (d.requested.group == 'io.netty' && d.requested.version?.startsWith('4.1.')) d.useVersion('4.1.137.Final')
              }
            }
          }
          dependencies {
            probe 'com.android.tools.build:gradle:8.12.1'
            probe 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
            probe 'org.jetbrains.dokka:dokka-gradle-plugin:1.4.32'
            probe 'com.diffplug.spotless:spotless-plugin-gradle:7.2.1'
            probe 'io.github.gradle-nexus:publish-plugin:2.0.0'
            probe 'org.ajoberstar.grgit:grgit-gradle:5.3.2'
          }
          tasks.register('report') {
            doLast {
              def ac = configurations.probe.incoming.artifactView { it.lenient(true) }.artifacts
              ac.artifactFiles.files
              def blocked = new TreeSet()
              ac.failures.each { Throwable f ->
                def msgs = []
                for (Throwable t = f; t != null; t = t.cause) { msgs << (t.message ?: '').readLines().find { it.trim() } }
                blocked << (msgs.find { it?.startsWith('Could not download') || it?.startsWith('Could not resolve') || it?.startsWith('Could not find') } ?: msgs.first())
              }
              println "RESOLVED ARTIFACTS: ${ac.artifacts.size()}"
              println "BLOCKED/FAILED: ${blocked.size()}"
              blocked.each { println "  BLOCKED ${it}" }
            }
          }
          GRADLE
          ./gradlew -q -p "$s" report 2>&1 | grep -E "RESOLVED ARTIFACTS|BLOCKED|What went wrong|^> |^A problem|rror:" | grep -v "^\s*\^\[" | cut -c1-230 | head -40
