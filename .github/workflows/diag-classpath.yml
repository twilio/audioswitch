# TEMPORARY diagnostic: which artifacts on the build classpath are still blocked once netty and
# bcprov are overridden? Resolves in a scratch project, leniently. Delete after use.
name: Diag Classpath

on:
  push:
    branches: ["supplychain_*"]
    paths: [".github/workflows/diag-classpath.yml"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-x64
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"
      - run: cp .github/gradle/zz-mirrors-extra.init.gradle ~/.gradle/init.d/zz-mirrors-extra.init.gradle
      - name: Resolve classpath in a scratch project
        run: |
          s="$RUNNER_TEMP/scratch"; mkdir -p "$s"
          echo "rootProject.name = 'scratch'" > "$s/settings.gradle"
          cat > "$s/build.gradle" <<'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies {
              classpath 'com.android.tools.build:gradle:8.12.1'
              classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.22'
              classpath 'org.jetbrains.dokka:dokka-gradle-plugin:1.4.32'
              classpath 'com.diffplug.spotless:spotless-plugin-gradle:7.2.1'
              classpath 'io.github.gradle-nexus:publish-plugin:2.0.0'
              classpath 'org.ajoberstar.grgit:grgit-gradle:5.3.2'
            }
            configurations.classpath.resolutionStrategy.eachDependency { d ->
              if (d.requested.group == 'org.bouncycastle') d.useVersion('1.85')
              if (d.requested.group == 'io.netty' && d.requested.version?.startsWith('4.1.')) d.useVersion('4.1.137.Final')
            }
          }
          tasks.register('report') {
            doLast {
              def cfg = buildscript.configurations.classpath
              def ac = cfg.incoming.artifactView { it.lenient(true) }.artifacts
              ac.artifactFiles.files
              def blocked = ac.failures.collect { it.cause ? it.cause.message : it.message }.collect { m -> (m =~ /Could not (?:download|resolve) ([^\n]*)/).with { find() ? group(1) : m.readLines().first() } }.unique().sort()
              println "RESOLVED ARTIFACTS: ${ac.artifacts.size()}"
              println "BLOCKED/FAILED: ${blocked.size()}"
              blocked.each { println "  BLOCKED ${it}" }
            }
          }
          GRADLE
          ./gradlew -q -p "$s" report 2>&1 | grep -E "RESOLVED|BLOCKED|FAILED|wrong|rror" | cut -c1-220 | head -40
