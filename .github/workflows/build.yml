name: Build

on:
  push:
    branches: ["supplychain_*"]
  pull_request:

permissions:
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  # Stage 1: verify every dependency (buildscript, plugins, project) resolves through Artifactory.
  resolve-dependencies:
    name: Resolve dependencies
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Artifactory OIDC
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"

      - name: Resolve dependencies
        run: ./gradlew --refresh-dependencies buildEnvironment audioswitch:dependencies

  # Stage 2: assemble the library and the instrumentation test APKs.
  build:
    name: Build
    needs: resolve-dependencies
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Artifactory OIDC
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"

      - name: Build AudioSwitch and tests
        run: ./gradlew -q audioswitch:assemble audioswitch:assembleAndroidTest

      - name: Upload build outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: audioswitch-build
          path: audioswitch/build/outputs
          if-no-files-found: error

  # Stage 3: checks and tests. Independent of each other, all run after dependencies resolve.

  lint:
    name: Lint
    needs: resolve-dependencies
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Artifactory OIDC
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"

      - name: Lint
        run: ./gradlew -q lint

      - name: Upload lint-results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-results
          path: audioswitch/build/reports/lint-results*.html
          if-no-files-found: warn

  check-format:
    name: Check format
    needs: resolve-dependencies
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Artifactory OIDC
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"

      - name: Check format
        run: ./gradlew -q spotlessCheck

  unit-tests:
    name: Unit tests
    needs: build
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'ubuntu-x64' }}
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Artifactory OIDC
        if: ${{ !github.event.pull_request.head.repo.fork }}
        uses: twilio/sdk-actions/artifactory-oidc@ee249453b64609cf2e92f9bba8c3337d3ca9f95a # java_gradle
        with:
          ecosystem: "gradle"

      - name: Unit tests
        run: ./gradlew audioswitch:testDebugUnitTest

      - name: Upload unit-test-reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports
          path: audioswitch/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn

  # Stage 4: instrumentation tests on Firebase Test Lab. Authenticates with GCP through workload
  # identity federation (no stored key), so it never runs for fork PRs, which get no OIDC token.
  integration-tests:
    name: Integration tests
    needs: [build, lint, check-format]
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-x64
    permissions:
      id-token: write
      contents: read
    timeout-minutes: 45
    env:
      GCP_PROJECT: video-app-79418
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download build outputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: audioswitch-build
          path: audioswitch/build/outputs

      - name: Check runner prerequisites
        run: |
          gcloud --version | head -1
          echo "testing.googleapis.com -> HTTP $(curl -s -o /dev/null -w '%{http_code}' https://testing.googleapis.com/)"
          ls audioswitch/ftl/app-debug.apk audioswitch/build/outputs/apk/androidTest/debug/audioswitch-debug-androidTest.apk

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/285008367772/locations/global/workloadIdentityPools/github/providers/github-actions
          service_account: ahoy-video-app@video-app-79418.iam.gserviceaccount.com

      - name: Run integration tests
        run: >
          gcloud firebase test android run --use-orchestrator
          --environment-variables clearPackageData=true --no-record-video
          --project "$GCP_PROJECT" ui-test-args.yaml:integration-tests
