name: Enforce Artifactory
description: >
  Completes twilio/sdk-actions/artifactory-oidc (run it first): routes buildscript, plugin portal and
  settings repositories through the Artifactory mirrors with an init script. CI only; the repository
  build itself keeps public repositories. The Gradle wrapper distribution is not mirrored (curated
  Artifactory has no services.gradle.org remote); it is verified by distributionSha256Sum instead.

runs:
  using: composite
  steps:
    - name: Install enforcement init script
      shell: bash
      run: |
        mkdir -p "${HOME}/.gradle/init.d"
        cp "${GITHUB_WORKSPACE}/.github/gradle/zz-enforce-artifactory.init.gradle" "${HOME}/.gradle/init.d/"
